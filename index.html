        <h1 style="font-size:1.6rem;color:#1B355A;margin-bottom:8px">🛣️ 고속도로 휴게소 정보 허브</h1>
        <p>전국 고속도로 휴게소 및 나들목의 실시간 정보를 제공하는 종합 서비스입니다. 주유소 가격, 전기차 충전소, 브랜드 매장, 편의시설, 날씨, 교통량, 운전 안전 정보 등을 공공데이터포털의 실시간 데이터와 연동하여 제공합니다. 본 서비스를 이용하려면 JavaScript를 활성화해 주세요.</p>

        <h2 style="font-size:1.2rem;color:#1B355A;margin:28px 0 10px;border-bottom:2px solid #e0e0e0;padding-bottom:4px">제공 서비스</h2>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">🔍 휴게소 검색</h3>
        <p>전국 고속도로 휴게소(휴게소, 간이휴게소, 나들목)를 노선별, 지역별로 검색할 수 있습니다. 각 휴게소의 위치, 운영 시간, 연락처, 주차장 규모 등 기본 정보를 제공합니다.</p>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">⛽ 주유소 가격 정보</h3>
        <p>휴게소 내 주유소의 실시간 유류 가격 정보를 제공합니다. 휘발유, 경유, LPG 가격을 비교할 수 있으며, 고속도로 구간별 가장 저렴한 주유소를 찾는 데 도움을 드립니다. 공공데이터포털의 실시간 유가 데이터를 연동하여 정확한 정보를 제공합니다.</p>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">🔌 전기차 충전소 현황</h3>
        <p>휴게소 내 전기차 충전소의 충전기 타입(급속/완속), 충전기 수, 운영 여부, 호환 차종 정보를 제공합니다. 전기차 장거리 운전 시 충전 계획을 세우는 데 필수적인 정보입니다.</p>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">🍽️ 브랜드 매장 및 식당</h3>
        <p>각 휴게소에 입점한 식당, 카페, 편의점, 패스트푸드 등 브랜드 매장 정보를 제공합니다. 휴게소별 대표 메뉴, 평균 가격대, 영업 시간을 확인할 수 있어 여행 중 식사 계획에 유용합니다.</p>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">🏥 편의시설 정보</h3>
        <p>화장실, 수유실, 약국, 화물차 휴게소, 샤워실, 수면실 등 편의시설 정보를 제공합니다. 장거리 운전자와 가족 여행객을 위한 맞춤형 편의시설 안내로 쾌적한 휴식을 돕습니다.</p>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">🌤️ 날씨 및 도로 정보</h3>
        <p>휴게소 위치의 실시간 날씨, 주간 예보, 노면 상태, 홍수 위험, 낙뢰 경보 등 기상 및 도로 안전 정보를 제공합니다. 기상청 데이터를 연동하여 운전 안전에 직결되는 정보를 실시간으로 안내합니다.</p>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">🚗 교통량 및 경로 정보</h3>
        <p>고속도로 구간별 실시간 교통량, 소통 정보, 경로별 예상 시간을 제공합니다. 최적의 경로를 선택하고 교통체증을 피할 수 있도록 돕습니다. 구간별 교통사고 다발 지역과 운전 안전 가이드도 함께 제공합니다.</p>

        <h3 style="font-size:1.05rem;color:#2a4a6a;margin:20px 0 6px">🎉 휴게소 이벤트</h3>
        <p>전국 휴게소에서 진행 중인 할인 프로모션, 페스티벌, 지역 특산품 전, 체험 프로그램 등 다양한 이벤트 정보를 한곳에서 확인할 수 있습니다.</p>

        <h2 style="font-size:1.2rem;color:#1B355A;margin:28px 0 10px;border-bottom:2px solid #e0e0e0;padding-bottom:4px">서비스 특징</h2>

          <li><strong>무료 이용:</strong> 모든 정보는 무료이며 회원가입 없이 바로 이용할 수 있습니다.</li>
          <li><strong>모바일 최적화:</strong> 운전 중이나 여행 중에도 스마트폰으로 편리하게 정보를 확인할 수 있습니다.</li>

        <h2 style="font-size:1.2rem;color:#1B355A;margin:28px 0 10px;border-bottom:2px solid #e0e0e0;padding-bottom:4px">자주 묻는 질문</h2>
        <p><strong>Q: 주유소 가격은 실시간인가요?</strong><br/>A: 공공데이터포털의 유가정보 API를 통해 제공되며, 데이터 갱신 주기는 통상 1~2시간입니다. 실제 주유 시 가격이 다를 수 있으니 참고용으로 활용해 주세요.</p>
        <p><strong>Q: 전기차 충전소 예약이 가능한가요?</strong><br/>A: 현재 충전소 정보 제공만 가능하며, 충전 예약은 각 충전사(차지비, 에버온, 한국전력 등) 앱을 통해 확인하시기 바랍니다.</p>
        <p><strong>Q: 노선별 휴게소 목록을 볼 수 있나요?</strong><br/>A: 네, 경부선, 영동선, 호남선, 중부선 등 주요 고속도로 노선별로 휴게소를 검색할 수 있습니다.</p>
        <p><strong>Q: 날씨 정보는 어디서 가져오나요?</strong><br/>A: 기상청의 공공데이터를 연동하여 휴게소 위치의 실시간 날씨와 주간 예보를 제공합니다.</p>
